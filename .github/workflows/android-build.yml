name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt-get install -y build-essential libltdl-dev libffi-dev libssl-dev python3-dev zip unzip autoconf libtool libtool-bin

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip setuptools wheel Cython==0.29.33 virtualenv
          pip install buildozer

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload resulting APK
        uses: actions/upload-artifact@v3
        with:
          name: MELE_Reviewer_APK
          path: bin/*.apk
